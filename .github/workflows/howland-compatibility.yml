name: Howland compatibility
on:
  pull_request:
    branches: [howland-sidecar]
  push:
    branches: [howland-sidecar]
permissions:
  contents: read
concurrency:
  group: howland-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    if: github.repository == 'ayers-software-repair/opencode'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [core, opencode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Type check the package
        working-directory: packages/${{ matrix.package }}
        run: bun typecheck
      - name: Exercise the actual request construction and lifecycle
        working-directory: packages/${{ matrix.package }}
        shell: bash
        run: |
          if [[ "${{ matrix.package }}" = core ]]; then
            bun test test/session-runner.test.ts --timeout 30000
          else
            bun test test/session/dispatch-budget.test.ts test/session/prompt.test.ts --timeout 30000
          fi
      - name: Regenerate public API clients
        if: matrix.package == 'opencode'
        run: |
          bun run --cwd packages/client generate
          bun run packages/sdk/js/script/build.ts
          git diff --binary -- packages/client/src/generated packages/client/src/generated-effect packages/sdk/js/src > generated-client-changes.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.package == 'opencode'
        with:
          name: generated-client-changes
          path: generated-client-changes.patch
          if-no-files-found: error
      - name: Require committed API generation
        if: matrix.package == 'opencode'
        run: git diff --exit-code -- packages/client/src/generated packages/client/src/generated-effect packages/sdk/js/src
